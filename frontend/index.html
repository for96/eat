<style>
  :root {
    /* default palette: "Crema" (will be overridden by JS from tweaks) */
    --bg: #F2ECDF;
    --bg-2: #EAE1CF;
    --surface: #FBF7EE;
    --surface-2: #F6F1E5;
    --ink: #1F1B16;
    --ink-2: #4A413A;
    --ink-soft: #7A6F62;
    --ink-faint: #B5AB9B;
    --line: #E2D7C0;
    --line-soft: #ECE3D0;
    --accent: #C25A3A;
    --accent-soft: #E8C6B6;

    --kcal:    #1F1B16;
    --protein: #C25A3A;
    --carbs:   #D6A24E;
    --fat:     #7B8753;
    --fiber:   #8B9D7C;
    --water:   #3E6781;

    --font-display: "Newsreader", "Times New Roman", serif;
    --font-ui: "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
    --font-mono: "Geist Mono", ui-monospace, monospace;
    --display-feat: "ss01" on, "ss02" on;

    --space: 1;
    --radius: 18px;
    --radius-sm: 12px;
    --radius-xl: 28px;
  }

  /* palette: notte */
  body[data-palette="notte"] {
    --bg: #161310; --bg-2: #1E1A15; --surface: #211C16; --surface-2: #2A241D;
    --ink: #F5EFE2; --ink-2: #D6CCB8; --ink-soft: #9C907D; --ink-faint: #5C5547;
    --line: #2E281F; --line-soft: #251F18; --accent: #E0794E; --accent-soft: #4A2E20;
    --kcal: #F5EFE2; --protein: #E0794E; --carbs: #E6B86A;
    --fat: #B1C57A; --fiber: #A8C09A; --water: #6FA0C7;
  }
  /* palette: bosco */
  body[data-palette="bosco"] {
    --bg: #ECEEE4; --bg-2: #DFE3D2; --surface: #F4F5EC; --surface-2: #EDEFE0;
    --ink: #1B2418; --ink-2: #384534; --ink-soft: #6A7461; --ink-faint: #A8B09C;
    --line: #D2D6C1; --line-soft: #DDE0CE; --accent: #3D6B3E; --accent-soft: #C5D5C1;
    --kcal: #1B2418; --protein: #3D6B3E; --carbs: #C49B4A;
    --fat: #B05B3A; --fiber: #6A8A5E; --water: #3E6781;
  }
  /* palette: carta */
  body[data-palette="carta"] {
    --bg: #F7F6F2; --bg-2: #EEEDE7; --surface: #FFFFFF; --surface-2: #F6F5F1;
    --ink: #0F1115; --ink-2: #2E323B; --ink-soft: #6B6E78; --ink-faint: #B7BAC2;
    --line: #DEDDD6; --line-soft: #EAE9E3; --accent: #2A4DB8; --accent-soft: #D4DCEF;
    --kcal: #0F1115; --protein: #2A4DB8; --carbs: #D08020;
    --fat: #6B7B40; --fiber: #4F8A8B; --water: #2A4DB8;
  }

  body[data-density="compact"] { --space: 0.75; --radius: 14px; --radius-sm: 10px; --radius-xl: 22px; }
  body[data-density="cozy"]    { --space: 1.15; --radius: 22px; --radius-sm: 14px; --radius-xl: 32px; }

  /* typography presets */
  body[data-type="moderno"] {
    --font-display: "Geist", ui-sans-serif, system-ui, sans-serif;
    --font-ui: "Geist", ui-sans-serif, system-ui, sans-serif;
  }
  body[data-type="classico"] {
    --font-display: "DM Serif Display", "Times New Roman", serif;
    --font-ui: "Geist", ui-sans-serif, system-ui, sans-serif;
  }
  body[data-type="instrument"] {
    --font-display: "Instrument Serif", "Times New Roman", serif;
    --font-ui: "Geist", ui-sans-serif, system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    min-height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: pan-y;
    -webkit-text-size-adjust: 100%;
  }
  body {
    min-height: 100vh;
    min-height: 100svh;
    position: fixed;
    inset: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 15px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-feature-settings: "ss01", "cv11";
  }

  /* Ambient frame */
  .ambient {
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 24px;
    background:
      radial-gradient(120% 80% at 50% -10%, var(--bg-2) 0%, transparent 60%),
      var(--bg);
    background-attachment: fixed;
  }
  .stage {
    width: 100%;
    max-width: 420px;
    height: min(880px, calc(100vh - 48px));
    height: min(880px, calc(100svh - 48px));
    min-height: 720px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 36px;
    box-shadow:
      0 1px 0 rgba(255,255,255,.5) inset,
      0 30px 60px -20px rgba(31,27,22,.25),
      0 10px 30px -10px rgba(31,27,22,.15);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  @media (max-width: 520px) {
    .ambient { padding: 0; }
    .stage { max-width: 100%; height: 100vh; height: 100dvh; min-height: 100svh; border-radius: 0; border: 0; box-shadow: none; }
  }

  .scroller {
    flex: 1 1 auto;
    overflow-y: auto;
    overflow-x: hidden;
    overscroll-behavior: contain;
    overscroll-behavior-y: contain;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px));
  }
  .scroller::-webkit-scrollbar { display: none; }

  /* Common */
  .display { font-family: var(--font-display); font-feature-settings: var(--display-feat); letter-spacing: -0.01em; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .num { font-variant-numeric: tabular-nums; }
  .eyebrow {
    font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-soft); font-weight: 500;
  }
  button, input, textarea, select, a { touch-action: manipulation; }
  button { font-family: inherit; }

  /* Hide scrollbars on horizontal scrollers */
  .hscroll { overflow-x: auto; scrollbar-width: none; }
  .hscroll::-webkit-scrollbar { display: none; }

  #root { display: contents; }

  /* Loading splash before React mounts */
  .splash {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: var(--bg); color: var(--ink-soft);
    font-family: var(--font-display); font-style: italic; font-size: 20px;
  }
  .splash::after {
    content: ""; display: block; margin: 12px auto 0; width: 20px; height: 20px;
    border-radius: 50%; border: 2px solid var(--ink-faint); border-top-color: var(--accent);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Update banner style matching Pasto aesthetics */
  .update-banner {
    position: fixed;
    bottom: calc(16px + env(safe-area-inset-bottom));
    right: 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 12px 16px;
    border-radius: var(--radius-sm);
    font-family: var(--font-ui);
    font-size: 13.5px;
    z-index: 250;
    display: none;
    align-items: center;
    gap: 12px;
    box-shadow:
      0 12px 30px -10px rgba(31,27,22,.15),
      0 4px 12px -5px rgba(31,27,22,.1);
    animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .update-banner.show {
    display: flex;
  }
  .update-banner span {
    font-weight: 500;
  }
  .update-banner button {
    background: var(--accent);
    border: none;
    color: #fff;
    padding: 6px 12px;
    border-radius: 8px;
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: filter 0.15s ease;
  }
  .update-banner button:hover {
    filter: brightness(1.15);
  }
  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  
  @media (max-width: 520px) {
    .update-banner {
      left: 16px;
      right: 16px;
      bottom: calc(16px + env(safe-area-inset-bottom));
      justify-content: space-between;
    }
  }
</style>
</head>
<body data-palette="crema" data-density="regular" data-type="editoriale">

<div id="root">
  <div class="splash">eat</div>
</div>

<script>
  (function () {
    let touchStartX = 0;
    let touchStartY = 0;
    let lastTouchEnd = 0;

    function preventGesture(event) {
      event.preventDefault();
    }

    function eventElement(event) {
      if (!event.target) return null;
      if (event.target.nodeType === 1) return event.target;
      return event.target.parentElement || null;
    }

    function isInteractive(event) {
      const target = eventElement(event);
      return Boolean(target && target.closest("button,a,input,select,textarea,label,[role='button']"));
    }

    function nearestScrollable(node) {
      while (node && node !== document.body) {
        if (node.nodeType === 1) {
          const style = window.getComputedStyle(node);
          const canScroll = /(auto|scroll|overlay)/.test(style.overflowY)
            && node.scrollHeight > node.clientHeight;
          if (canScroll || node.classList.contains("scroller")) return node;
        }
        node = node.parentElement;
      }
      return document.querySelector(".scroller");
    }

    ["gesturestart", "gesturechange", "gestureend"].forEach((name) => {
      document.addEventListener(name, preventGesture, { passive: false });
    });

    document.addEventListener("dblclick", preventGesture, { passive: false });

    document.addEventListener("touchstart", (event) => {
      if (event.touches.length === 1) {
        touchStartX = event.touches[0].clientX;
        touchStartY = event.touches[0].clientY;
      }
    }, { passive: true });

    document.addEventListener("touchmove", (event) => {
      if (isInteractive(event)) return;

      if (event.touches.length > 1) {
        event.preventDefault();
        return;
      }

      const scrollable = nearestScrollable(event.target);
      if (!scrollable || scrollable.scrollHeight <= scrollable.clientHeight) {
        event.preventDefault();
        return;
      }

      const x = event.touches[0].clientX;
      const y = event.touches[0].clientY;
      const deltaX = x - touchStartX;
      const deltaY = y - touchStartY;
      if (Math.abs(deltaY) <= Math.abs(deltaX)) return;

      const pullingDown = deltaY > 0;
      const pullingUp = deltaY < 0;
      const atTop = scrollable.scrollTop <= 0;
      const atBottom = Math.ceil(scrollable.scrollTop + scrollable.clientHeight) >= scrollable.scrollHeight;

      if ((atTop && pullingDown) || (atBottom && pullingUp)) {
        event.preventDefault();
      }
    }, { passive: false });

    document.addEventListener("touchend", (event) => {
      if (isInteractive(event)) {
        lastTouchEnd = 0;
        return;
      }
      const now = Date.now();
      if (now - lastTouchEnd < 320) {
        event.preventDefault();
      }
      lastTouchEnd = now;
    }, { passive: false });
  })();
</script>

<script>
  window.EAT_BUILD_ID = "dev";

  (function () {
    const RESCUE_KEY = "eat.splash-rescue";
    const RESCUE_AFTER_MS = 6000;

    function clearRescueFlag() {
      try { sessionStorage.removeItem(RESCUE_KEY); } catch (e) {}
    }

    function reloadOnce() {
      try {
        if (sessionStorage.getItem(RESCUE_KEY)) return;
        sessionStorage.setItem(RESCUE_KEY, String(Date.now()));
      } catch (e) {}
      window.location.reload();
    }

    window.EAT_CLEAR_SPLASH_RESCUE = clearRescueFlag;

    window.setTimeout(function () {
      const splash = document.querySelector("#root .splash");
      if (!splash) {
        clearRescueFlag();
        return;
      }

      splash.textContent = "Aggiornamento";
      if (typeof window.EAT_REFRESH_APP === "function") {
        try {
          if (sessionStorage.getItem(RESCUE_KEY)) return;
          sessionStorage.setItem(RESCUE_KEY, String(Date.now()));
        } catch (e) {}
        window.EAT_REFRESH_APP();
        return;
      }
      if ("serviceWorker" in navigator) {
        Promise.race([
          navigator.serviceWorker.getRegistration()
            .then(function (registration) {
              return registration ? registration.update() : null;
            }),
          new Promise(function (resolve) { window.setTimeout(resolve, 2500); }),
        ])
          .then(function (registration) {
            return registration || null;
          })
          .catch(function () {})
          .finally(reloadOnce);
      } else {
        reloadOnce();
      }
    }, RESCUE_AFTER_MS);
  })();
</script>

<!-- React 18: vendorizzato nella build, niente CDN JS al boot -->
<script defer src="/vendor/react.production.min.js"></script>

<!-- Default tweaks. Cambia qui se vuoi che parta in notte/bosco/carta. -->
<script>
  window.EAT_DEFAULTS = {
    palette: "crema",
    density: "regular",
    typography: "editoriale"
  };
  // Light mode = crema, dark mode = notte. Se l'utente del sistema preferisce
  // dark e non c'è ancora una preferenza salvata, switcha al boot.
  try {
    const saved = localStorage.getItem("eat.palette") || localStorage.getItem("pasto.palette");
    if (saved) {
      window.EAT_DEFAULTS.palette = saved;
      localStorage.setItem("eat.palette", saved);
    } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
      window.EAT_DEFAULTS.palette = "notte";
    }
    document.body.dataset.palette = window.EAT_DEFAULTS.palette;
  } catch (e) { /* localStorage non disponibile in modalità privata, ignora */ }
</script>

<!-- Bundle dell'app: tutti i .jsx/.js concatenati e compilati da build.mjs -->

<!-- Registrazione Service Worker (offline + installabile) con Prompt di Aggiornamento -->
<script>
  (function () {
    const UPDATE_RELOAD_KEY = "eat.update-reload";

    if (!("serviceWorker" in navigator)) {
      window.EAT_REFRESH_APP = function () { window.location.reload(); };
      return;
    }

    let refreshingForUpdate = false;
    const hadControllerAtBoot = Boolean(navigator.serviceWorker.controller);

    function withTimeout(promise, ms) {
      return Promise.race([
        promise,
        new Promise(function (_, reject) {
          window.setTimeout(function () { reject(new Error("timeout")); }, ms);
        }),
      ]);
    }

    function markUpdateReload() {
      try { sessionStorage.setItem(UPDATE_RELOAD_KEY, String(Date.now())); } catch (e) {}
    }

    function clearUpdateReload() {
      try { sessionStorage.removeItem(UPDATE_RELOAD_KEY); } catch (e) {}
    }

    function needsUpdateReload() {
      try { return Boolean(sessionStorage.getItem(UPDATE_RELOAD_KEY)); } catch (e) { return false; }
    }

    function reloadApp() {
      clearUpdateReload();
      window.location.reload();
    }

    async function clearAppCaches() {
      if (!("caches" in window)) return;
      try {
        const keys = await caches.keys();
        await Promise.all(
          keys
            .filter(function (key) { return key.startsWith("eat-") || key.startsWith("pasto-"); })
            .map(function (key) { return caches.delete(key); }),
        );
      } catch (e) {}
    }

    async function hardReloadApp() {
      clearUpdateReload();
      await clearAppCaches();
      window.location.reload();
    }

    function applyWorker(worker) {
      if (!worker) {
        reloadApp();
        return;
      }
      markUpdateReload();

      if (worker.state === "installed" || worker.state === "activated") {
        worker.postMessage({ type: "EAT_SKIP_WAITING" });
      } else {
        worker.addEventListener("statechange", function onStateChange() {
          if (worker.state === "installed") {
            worker.removeEventListener("statechange", onStateChange);
            worker.postMessage({ type: "EAT_SKIP_WAITING" });
          }
        });
      }

      window.setTimeout(function () {
        if (!refreshingForUpdate) reloadApp();
      }, 1600);
    }

    window.EAT_REFRESH_APP = async function (workerHint) {
      if (workerHint) {
        applyWorker(workerHint);
        return;
      }

      try {
        const registration = await navigator.serviceWorker.getRegistration();
        if (!registration) {
          await hardReloadApp();
          return;
        }

        const existingWorker = registration.waiting || registration.installing;
        if (existingWorker) {
          applyWorker(existingWorker);
          return;
        }

        const updatedRegistration = await withTimeout(registration.update(), 4500).catch(function () {
          return registration;
        });
        const nextWorker = updatedRegistration.waiting || updatedRegistration.installing;
        if (nextWorker) {
          applyWorker(nextWorker);
          return;
        }
      } catch (err) {
        console.warn("[SW] update failed:", err);
      }

      await hardReloadApp();
    };

    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (refreshingForUpdate) return;
      if (!hadControllerAtBoot && !needsUpdateReload()) return;
      refreshingForUpdate = true;
      reloadApp();
    });

    navigator.serviceWorker.addEventListener("message", function (event) {
      if (event.data && event.data.type === "EAT_SW_READY" && needsUpdateReload()) {
        reloadApp();
      }
    });

    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/sw.js", { updateViaCache: "none" })
        .then(function (registration) {
          registration.update().catch(function () {});

          if (registration.waiting && hadControllerAtBoot) {
            triggerUpdate(registration.waiting);
          }

          registration.addEventListener("updatefound", function () {
            const worker = registration.installing;
            if (!worker) return;
            worker.addEventListener("statechange", function () {
              if (worker.state === "installed" && navigator.serviceWorker.controller) {
                triggerUpdate(worker);
              }
            });
          });
        })
        .catch(function (err) {
          console.warn("[SW] registration failed:", err);
        });
    });

    function triggerUpdate(worker) {
      let banner = document.getElementById("updateBanner");
      if (!banner) {
        banner = document.createElement("div");
        banner.id = "updateBanner";
        banner.className = "update-banner";
        banner.innerHTML = "<span>Nuova versione disponibile</span> <button type=\"button\">Aggiorna</button>";
        document.body.appendChild(banner);
      }
      const button = banner.querySelector("button");
      banner.classList.add("show");
      button.disabled = false;
      button.textContent = "Aggiorna";
      button.onclick = function () {
        button.disabled = true;
        button.textContent = "Aggiorno...";
        banner.classList.remove("show");
        window.EAT_REFRESH_APP(worker);
      };
    }
  })();
</script>
